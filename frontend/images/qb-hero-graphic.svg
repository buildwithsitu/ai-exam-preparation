<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260" role="img" aria-label="Technical Question Bank Study Desk Illustration">
  <defs>
    <radialGradient id="deskGlow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#5b3ce8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b2896" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="280" cy="130" r="140" fill="url(#deskGlow)" />

  <!-- Botanical Plant Leaves in Background -->
  <g transform="translate(180, 20)">
    <path d="M40 90 C 20 60, 40 20, 60 0 C 55 40, 60 70, 40 90 Z" fill="#86efac" />
    <path d="M60 90 C 75 40, 60 10, 45 0 C 65 20, 70 55, 60 90 Z" fill="#4ade80" />
    <path d="M50 90 C 80 60, 95 30, 90 10 C 85 40, 70 70, 50 90 Z" fill="#22c55e" />
  </g>

  <!-- Desk Surface Horizon -->
  <line x1="20" y1="210" x2="440" y2="210" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Stack of Textbooks (Center Left) -->
  <g transform="translate(160, 130)">
    <!-- Book 3 (Bottom - White/Cream) -->
    <rect x="0" y="52" width="115" height="18" rx="3" fill="#f8fafc" />
    <rect x="5" y="55" width="105" height="2" fill="#cbd5e1" />
    <rect x="110" y="54" width="4" height="14" fill="#e2e8f0" rx="1" />

    <!-- Book 2 (Middle - Deep Purple with 'DSA' label) -->
    <rect x="6" y="28" width="112" height="22" rx="4" fill="#3b2896" />
    <rect x="10" y="31" width="100" height="2" fill="#ffffff" opacity="0.6" />
    <text x="62" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">DSA</text>
    <rect x="112" y="30" width="4" height="18" fill="#e0e7ff" rx="1" />

    <!-- Book 1 (Top - Lavender / Light Purple) -->
    <rect x="12" y="6" width="100" height="20" rx="4" fill="#a78bfa" />
    <rect x="16" y="9" width="90" height="2" fill="#ffffff" opacity="0.7" />
    <rect x="106" y="8" width="4" height="16" fill="#ede9fe" rx="1" />
  </g>

  <!-- Pen Cup with Pens (Right Desk) -->
  <g transform="translate(390, 150)">
    <rect x="0" y="16" width="26" height="34" rx="4" fill="#ffffff" opacity="0.9" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Yellow Pen -->
    <line x1="6" y1="18" x2="2" y2="0" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <!-- Blue Pen -->
    <line x1="13" y1="18" x2="13" y2="-4" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" />
    <!-- Green / Purple Pen -->
    <line x1="20" y1="18" x2="24" y2="2" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Open Laptop with Test Checklist on Screen -->
  <g transform="translate(255, 95)">
    <!-- Screen Display -->
    <polygon points="15,0 125,0 135,100 0,100" fill="url(#laptopGrad)" />
    <!-- Screen Bezel Interior (White Test Screen) -->
    <polygon points="18,3 122,3 131,97 5,97" fill="#ffffff" />

    <!-- Test Screen Content: Green Checkmark Questions -->
    <!-- Checklist Item 1 -->
    <circle cx="28" cy="25" r="7" fill="#dcfce7" />
    <path d="M25 25 L27 27 L31 22" stroke="#16a34a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="22" width="65" height="5" rx="2.5" fill="#cbd5e1" />

    <!-- Checklist Item 2 -->
    <circle cx="28" cy="46" r="7" fill="#dcfce7" />
    <path d="M25 46 L27 48 L31 43" stroke="#16a34a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="43" width="72" height="5" rx="2.5" fill="#cbd5e1" />

    <!-- Checklist Item 3 -->
    <circle cx="28" cy="67" r="7" fill="#dcfce7" />
    <path d="M25 67 L27 69 L31 64" stroke="#16a34a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="40" y="64" width="55" height="5" rx="2.5" fill="#cbd5e1" />

    <!-- Checklist Item 4 (Option selector) -->
    <rect x="40" y="78" width="45" height="4" rx="2" fill="#93c5fd" />

    <!-- Laptop Keyboard Deck & Base -->
    <polygon points="-8,100 144,100 138,108 -15,108" fill="#94a3b8" />
    <polygon points="-15,108 138,108 134,111 -18,111" fill="#64748b" />
  </g>
</svg>

